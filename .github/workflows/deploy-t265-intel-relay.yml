name: Deploy T265 Intel Firmware Relay

on:
  workflow_dispatch:
  push:
    branches: ["main", "intel-fw-runtime-relay"]
    paths:
      - "relay/cloudflare-worker/**"
      - ".github/workflows/deploy-t265-intel-relay.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay/cloudflare-worker
          wranglerVersion: "4"
          command: deploy

      - name: Verify relay end-to-end
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(printf '%s' "${DEPLOYMENT_URL}" | head -n1 | sed 's/[[:space:]].*$//')"
          if [[ -z "${deployment}" ]]; then
            echo "Cloudflare deployment URL was empty."
            exit 1
          fi
          if [[ "${deployment}" != http://* && "${deployment}" != https://* ]]; then
            deployment="https://${deployment}"
          fi

          relay_url="${deployment%/}/t265/0.2.0.951.mvcmd"
          expected_size="9323648"
          expected_sha="0265fd111611908b822cdaf4a3fe5b631c50539b2805d2f364c498aa71c007c0"
          target="${RUNNER_TEMP}/target-0.2.0.951.mvcmd"

          echo "Relay URL: ${relay_url}"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${target}" "${relay_url}"

          size="$(stat -c%s "${target}")"
          sha="$(sha256sum "${target}" | awk '{print $1}')"
          echo "Downloaded size: ${size}"
          echo "SHA-256: ${sha}"

          [[ "${size}" == "${expected_size}" ]]
          [[ "${sha}" == "${expected_sha}" ]]
          rm -f "${target}"
          echo "VERIFIED: Cloudflare relay returned the expected Intel T265 0.2.0.951 image."
