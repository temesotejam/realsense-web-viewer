name: Deploy RealSense Web Viewer to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/browser-depth.js
          node --check src/browser-pointcloud.js
          node --check src/t265-webusb.js
          node --check src/t265-official-fetch-test.js
          node --check src/t265-pose-rawfix.js
          node --check src/t265-pose.js
          node --check src/t265-direct.js
          node --check src/t265-autoboot-relay.js
          node --check src/realsense-sensor-api.js
          node --check src/realsense-sensor-client.js
          node --check src/sensor-api-test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
